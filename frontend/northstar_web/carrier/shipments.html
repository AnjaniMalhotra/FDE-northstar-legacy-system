<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shipments — Northstar Freight Carrier Portal</title>
<link rel="stylesheet" href="../shared/css/tokens.css">
<link rel="stylesheet" href="../shared/css/base.css">
</head>
<body data-portal="carrier">

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="../shared/images/logo.png" alt="Northstar Freight" class="logo-img"></div>
    <div class="sidebar-portal-label">Carrier Portal</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
      <a href="shipments.html" class="active"><span class="icon">🚛</span> My Shipments</a>
      <a href="disputes.html"><span class="icon">⚠️</span> Disputes / Revisions <span class="badge-count" id="badge-disputes" style="display:none;"></span></a>
    </nav>
    <div class="sidebar-foot">
      <span class="who" id="who-label">—</span>
      <a href="#" class="logout" onclick="NorthstarAuth.logout(); return false;">Log out</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar"><h1>My Shipments</h1></div>
    <div class="content">
      <div class="card">
        <div class="card-header"><h2>All Tendered Shipments</h2></div>
        <div id="table-wrap"></div>
      </div>
    </div>
  </div>
</div>

<script src="../shared/js/db.js"></script>
<script src="../shared/js/auth.js"></script>
<script src="../shared/js/ui.js"></script>
<script>
(async () => {
const user = await NorthstarAuth.requireAuth("carrier");
if (user) {
  document.getElementById("who-label").textContent = user.name;
  await renderCarrierBadges(user.carrierId);

  const shipments = (await NorthstarDB.query("shipments", (s) => s.carrierId === user.carrierId)).sort((a, b) => b.id - a.id);

  const wrap = document.getElementById("table-wrap");
  wrap.innerHTML = shipments.length === 0 ? `<div class="card-empty">No shipments tendered to you yet.</div>` :
    `<table><thead><tr><th>ID</th><th>Route</th><th>Weight</th><th>Pickup</th><th>Delivery</th><th class="num">Agreed Rate</th><th>Status</th></tr></thead>
    <tbody>${shipments.map((s) => `<tr class="clickable" onclick="window.location.href='shipment-detail.html?id=${s.id}'">
        <td>#${s.id}</td><td>${s.origin} &rarr; ${s.dest}</td><td>${s.weightLbs.toLocaleString()} lbs</td>
        <td>${formatDateTime(s.pickupAppt)}</td><td>${formatDateTime(s.deliveryAppt)}</td>
        <td class="num amt">${formatCurrency(s.agreedRate)}</td><td>${pillHtml(s.status)}</td>
      </tr>`).join("")}</tbody></table>`;
}
})();
</script>
</body>
</html>
