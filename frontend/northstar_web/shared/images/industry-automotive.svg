<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#bg)"/>
  <!-- diagonal texture lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="26">
    <line x1="-100" y1="500" x2="500" y2="-100"/>
    <line x1="0" y1="500" x2="600" y2="-100"/>
    <line x1="100" y1="500" x2="700" y2="-100"/>
    <line x1="200" y1="500" x2="800" y2="-100"/>
  </g>
  <g transform="translate(300,190)" fill="#ffffff" opacity="0.22">
    
      <circle cx="0" cy="0" r="85" fill-opacity="0.18"/>
      <circle cx="0" cy="0" r="55"/>
      <circle cx="0" cy="0" r="18" fill="#7f1d1d"/>
      <g stroke="#7f1d1d" stroke-width="10">
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
      </g>
    
  </g>
  <rect width="600" height="420" fill="url(#scrim)"/>
</svg>