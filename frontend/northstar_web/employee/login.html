<!-- ------------------------------------------
     NORTHSTAR FREIGHT — Employee Portal Login
     ------------------------------------------ -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Log In — Northstar Freight</title>
<link rel="stylesheet" href="../shared/css/tokens.css">
<link rel="stylesheet" href="../shared/css/base.css">
</head>
<body data-portal="employee">

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><img src="../shared/images/logo.png" alt="Northstar Freight" class="logo-img"></div>
    <div class="auth-eyebrow">Internal Staff Access</div>
    <h1 class="auth-heading">Sign in</h1>
    <p class="auth-sub">Employee Portal &mdash; Operations &amp; Accounts Payable Audit.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Work Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="ops@northstarfreight.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <p class="error-text" id="error-msg" style="display:none;">Incorrect email or password.</p>
      <button type="submit" class="btn btn-primary btn-block">Log In &rarr;</button>
    </form>

    <div class="demo-creds">
      <strong>Demo Accounts:</strong><br>
      Operations: <code>ops@northstarfreight.com</code><br>
      Accounts Payable: <code>ap@northstarfreight.com</code>
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="document.getElementById('email').value='ops@northstarfreight.com'; document.getElementById('password').value='demo123';">
          Fill Ops Demo
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="document.getElementById('email').value='ap@northstarfreight.com'; document.getElementById('password').value='demo123';">
          Fill AP Demo
        </button>
      </div>
    </div>
    <p class="auth-back"><a href="../index.html">&larr; Back to Northstar Freight Homepage</a></p>
  </div>
</div>

<script src="../shared/js/db.js"></script>
<script src="../shared/js/auth.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const user = await NorthstarAuth.login("employee", email, password);
  if (user) {
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error-msg").style.display = "block";
  }
});
</script>
</body>
</html>
